name: Rewrite Besi Subdomain Links to Apex Besi.co.id

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-besi-links-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"

      - name: Run link rewriter regression tests
        run: python .github/scripts/test_rewrite_besi_subdomain_links.py

      - name: Execute Link Rewriter Engine
        run: |
          python .github/scripts/rewrite_besi_subdomain_links.py --apply --root "$GITHUB_WORKSPACE"

      - name: Commit and push changes
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No files modified. Outbound bajabesi links already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(seo): rewrite bajabesi outbound links to parent apex besi.co.id [skip ci]"
          git push origin "HEAD:${TARGET_REF}"
